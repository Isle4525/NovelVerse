version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: novelverse-db
    environment:
      POSTGRES_DB: novelverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novelverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: novelverse-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: novelverse
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
